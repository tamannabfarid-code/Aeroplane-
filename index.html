<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerospace Frontier: Collection</title>
    <style>
        :root {
            --ui-blue: #3a7bd5;
            --ui-light-blue: #00d2ff;
            --bg-glass: rgba(220, 225, 235, 0.85);
            --border-color: #b0c4de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
        }

        /* UI Wrapper */
        .interface-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 10;
            pointer-events: none;
        }

        .interface-container * {
            pointer-events: auto;
        }

        /* 3D Canvas Styling */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Header */
        header {
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(180, 195, 210, 0.8), transparent);
            border-bottom: 2px solid var(--border-color);
            border-top: 2px solid var(--border-color);
            text-align: center;
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header h1 {
            color: #2c3e50;
            font-size: 24px;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Main Section layout */
        .main-content {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            padding: 20px 0;
        }

        /* Right Side Stats Panel */
        .stats-panel {
            width: 320px;
            background: var(--bg-glass);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-header {
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
        }

        .panel-header span {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: bold;
        }

        .panel-header h2 {
            color: #2c3e50;
            font-size: 20px;
            margin-top: 2px;
        }

        .plane-preview-thumb {
            width: 100%;
            height: 140px;
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plane-preview-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            color: #34495e;
        }

        .stat-label {
            color: #7f8c8d;
        }

        .stat-value {
            font-weight: 600;
        }

        .cost-row {
            margin-top: 5px;
            font-size: 16px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 10px;
        }

        .confirm-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .confirm-btn:hover {
            background: linear-gradient(135deg, #357abd, #2a639b);
            transform: translateY(-1px);
        }

        /* Bottom Selection Ribbon */
        .selection-ribbon {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px 0;
        }

        .plane-card {
            width: 180px;
            background: var(--bg-glass);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .plane-card:hover {
            transform: translateY(-5px);
            border-color: #7fb3d5;
        }

        .plane-card.active {
            border-color: #f39c12;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
            transform: translateY(-3px);
        }

        .card-icon {
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.4);
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .plane-card p {
            font-size: 12px;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="interface-container">
        
        <header>
            <h1>Aerospace Frontier: Collection</h1>
        </header>

        <main class="main-content">
            <div class="stats-panel">
                <div class="panel-header">
                    <span>Selected Plane</span>
                    <h2 id="plane-title">Artemis Class Biplane</h2>
                </div>
                
                <div class="plane-preview-thumb">
                    <img id="plane-thumb" src="artemis class biplane-plane.png" alt="Plane Preview" onerror="this.style.display='none'">
                </div>

                <div class="stats-list">
                    <div class="stat-row"><span class="stat-label">Manufacturer</span><span class="stat-value" id="val-vendor">AeroClassics</span></div>
                    <div class="stat-row"><span class="stat-label">Type</span><span class="stat-value" id="val-type">Classic Prop</span></div>
                    <div class="stat-row"><span class="stat-label">Role</span><span class="stat-value" id="val-role">Sport / Transport</span></div>
                    <div class="stat-row"><span class="stat-label">Range</span><span class="stat-value" id="val-range">350 miles</span></div>
                    <div class="stat-row"><span class="stat-label">Cruise Speed</span><span class="stat-value" id="val-speed">95 knots</span></div>
                    <div class="stat-row"><span class="stat-label">Passenger Cap.</span><span class="stat-value" id="val-cap">2</span></div>
                    <div class="stat-row cost-row"><span class="stat-label">Cost</span><span class="stat-value" id="val-cost">150,000 Credits</span></div>
                </div>

                <button class="confirm-btn">Confirm Selection</button>
            </div>
        </main>

        <div class="selection-ribbon" id="selector-ribbon">
            </div>
    </div>

    <script>
        // Data Structure matching your exact hyphenated lower-case asset naming strings
        const fleetData = [
            {
                id: "biplane",
                name: "Artemis Class Biplane",
                vendor: "AeroClassics",
                type: "Classic Prop",
                role: "Sport / Transport",
                range: "350 miles",
                speed: "95 knots",
                capacity: "2",
                cost: "150,000 Credits",
                icon: "artemis class biplane-plane.png",
                color: 0xd4ac0d
            },
            {
                id: "g6",
                name: "Artemis G-6 Interceptor",
                vendor: "Vanguard Aero",
                type: "Supersonic Jet",
                role: "Air Defense",
                range: "1,200 miles",
                speed: "Mach 1.6",
                capacity: "1",
                cost: "1,450,000 Credits",
                icon: "artemis g-6 interceptor-plane.png",
                color: 0x7b7d7d
            },
            {
                id: "f22",
                name: "F-22 Raptor",
                vendor: "Lockheed Precision",
                type: "Stealth Fighter",
                role: "Tactical Superiority",
                range: "1,800 miles",
                speed: "Mach 2.25",
                capacity: "1",
                cost: "2,500,000 Credits",
                icon: "f-22 raptor-plane.png",
                color: 0x34495e
            },
            {
                id: "nomad",
                name: "Nomad Skycar",
                vendor: "Omni-Tech VTOL",
                type: "Quad-VTOL Car",
                role: "Personal Transport",
                range: "450 miles",
                speed: "210 knots",
                capacity: "4",
                cost: "850,000 Credits",
                icon: "nomad skycar-plane.png",
                color: 0x2e4053
            }
        ];

        let activeIndex = 0;
        const ribbon = document.getElementById('selector-ribbon');
        
        function setupUI() {
            fleetData.forEach((plane, index) => {
                const card = document.createElement('div');
                card.className = `plane-card ${index === 0 ? 'active' : ''}`;
                card.setAttribute('data-index', index);
                card.innerHTML = `
                    <div class="card-icon">
                        <img src="${plane.icon}" alt="${plane.name}" onerror="this.parentElement.style.background='rgba(0,0,0,0.05)'">
                    </div>
                    <p>${plane.name}</p>
                `;
                
                card.addEventListener('click', () => selectPlane(index));
                ribbon.appendChild(card);
            });
        }

        function selectPlane(index) {
            if(index === activeIndex) return;
            
            document.querySelectorAll('.plane-card').forEach((c, i) => {
                c.classList.toggle('active', i === index);
            });

            activeIndex = index;
            const data = fleetData[index];

            document.getElementById('plane-title').innerText = data.name;
            document.getElementById('plane-thumb').src = data.icon;
            document.getElementById('plane-thumb').style.display = 'block'; // Make sure to show if hidden by previous error handling hooks
            document.getElementById('val-vendor').innerText = data.vendor;
            document.getElementById('val-type').innerText = data.type;
            document.getElementById('val-role').innerText = data.role;
            document.getElementById('val-range').innerText = data.range;
            document.getElementById('val-speed').innerText = data.speed;
            document.getElementById('val-cap').innerText = data.capacity;
            document.getElementById('val-cost').innerText = data.cost;

            trigger3DTransition(index);
        }

        // --- Three.js 3D Engine Setup ---
        let scene, camera, renderer, modelGroup;
        let meshes = [];
        let targetX = 0; 
        const slideSpeed = 0.08;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f3f5);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2, 7);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xaed6f1, 0.4);
            dirLight2.position.set(-5, 2, -5);
            scene.add(dirLight2);

            modelGroup = new THREE.Group();
            scene.add(modelGroup);

            buildProceduralPlaceholders();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildProceduralPlaceholders() {
            // 1. Biplane
            const biplaneGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.5, 2);
            const wingGeo = new THREE.BoxGeometry(3.2, 0.05, 0.6);
            const matYellow = new THREE.MeshStandardMaterial({ color: fleetData[0].color, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, matYellow);
            const topWing = new THREE.Mesh(wingGeo, matYellow);
            topWing.position.set(0, 0.5, 0.2);
            const bottomWing = new THREE.Mesh(wingGeo, matYellow);
            bottomWing.position.set(0, -0.2, 0.2);
            biplaneGroup.add(body, topWing, bottomWing);
            meshes.push(biplaneGroup);

            // 2. Artemis G-6
            const g6Group = new THREE.Group();
            const jetMat = new THREE.MeshStandardMaterial({ color: fleetData[1].color, roughness: 0.3, metalness: 0.2 });
            const fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.4, 2.5, 4), jetMat);
            fuselage.rotation.x = Math.PI / 2;
            const wings = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.2, 3), jetMat);
            wings.rotation.x = Math.PI / 2;
            wings.position.set(0, 0, -0.4);
            g6Group.add(fuselage, wings);
            meshes.push(g6Group);

            // 3. F-22 Raptor
            const f22Group = new THREE.Group();
            const stealthMat = new THREE.MeshStandardMaterial({ color: fleetData[2].color, roughness: 0.5, metalness: 0.5 });
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 2.4), stealthMat);
            const mainWings = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.5, 4), stealthMat);
            mainWings.rotation.x = Math.PI / 2;
            mainWings.scale.y = 0.1;
            f22Group.add(mainBody, mainWings);
            meshes.push(f22Group);

            // 4. Nomad Skycar
            const nomadGroup = new THREE.Group();
            const quadMat = new THREE.MeshStandardMaterial({ color: fleetData[3].color, metalness: 0.8, roughness: 0.2 });
            const pod = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), quadMat);
            pod.scale.set(1, 0.7, 1.6);
            const rotorGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.15, 8);
            const positions = [[0.8,0,0.6], [-0.8,0,0.6], [0.8,0,-0.6], [-0.8,0,-0.6]];
            positions.forEach(pos => {
                const rotor = new THREE.Mesh(rotorGeo, quadMat);
                rotor.position.set(...pos);
                nomadGroup.add(rotor);
            });
            nomadGroup.add(pod);
            meshes.push(nomadGroup);

            modelGroup.add(meshes[0]);
        }

        function trigger3DTransition(selectedIndex) {
            modelGroup.position.x = 4.5; // Snap model off-screen to the right
            
            while(modelGroup.children.length > 0){ 
                modelGroup.remove(modelGroup.children[0]); 
            }
            
            if(meshes[selectedIndex]) {
                modelGroup.add(meshes[selectedIndex]);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            modelGroup.rotation.y += 0.008;

            if (Math.abs(modelGroup.position.x - targetX) > 0.001) {
                modelGroup.position.x += (targetX - modelGroup.position.x) * slideSpeed;
            } else {
                modelGroup.position.x = targetX;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            setupUI();
            init3D();
        };
    </script>
</body>
</html>
