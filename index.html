<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aerospace Frontier | Full-Screen 3D Hangar</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Orbitron', monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: #e0f2fe;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

    /* ===== TECHNO GLOW & NEON EFFECTS ===== */
    :root {
      --neon-blue: #00d4ff;
      --neon-purple: #b000ff;
      --glass-bg: rgba(12, 20, 35, 0.75);
      --glass-border: rgba(0, 212, 255, 0.35);
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== FULL SCREEN 3D VIEWPORT ===== */
    .fullscreen-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0a1525, #020408);
      --poster-color: #050a14;
    }

    /* Slide transition for model viewer */
    model-viewer.model-transition {
      animation: modelSlideIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }

    @keyframes modelSlideIn {
      0% { 
        opacity: 0; 
        transform: scale(0.92) translateX(60px);
        filter: blur(3px);
      }
      100% { 
        opacity: 1; 
        transform: scale(1) translateX(0);
        filter: blur(0);
      }
    }

    /* Slide from left variant */
    model-viewer.model-slide-left {
      animation: modelSlideFromLeft 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }

    @keyframes modelSlideFromLeft {
      0% { 
        opacity: 0; 
        transform: scale(0.92) translateX(-60px);
        filter: blur(3px);
      }
      100% { 
        opacity: 1; 
        transform: scale(1) translateX(0);
        filter: blur(0);
      }
    }

    .model-status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      border-left: 3px solid var(--neon-blue);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-family: 'Orbitron', monospace;
      font-weight: 500;
      color: #bbf0ff;
      z-index: 10;
      pointer-events: none;
    }

    /* ===== TOP BAR - OVERLAY ===== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(8, 14, 26, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-family: 'Orbitron', monospace;
    }

    .brand-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 6px var(--neon-blue));
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 2px #00d4ff); }
      100% { filter: drop-shadow(0 0 8px #00aaff); }
    }

    .brand h1 {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff, #88ddff, #00b4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .version-tag {
      font-size: 0.7rem;
      color: #8db4d4;
      font-family: 'Orbitron', monospace;
    }

    /* ===== FLOATING RIGHT PANEL ===== */
    .floating-panel {
      position: fixed;
      top: 90px;
      right: 24px;
      width: 380px;
      max-height: calc(100vh - 280px);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 212, 255, 0.1);
      overflow-y: auto;
      z-index: 15;
      transition: all 0.3s ease;
    }

    .floating-panel::-webkit-scrollbar { width: 4px; }
    .floating-panel::-webkit-scrollbar-track { background: #0f1a2c; border-radius: 10px; }
    .floating-panel::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

    .panel-header {
      padding: 12px 20px 0;
    }

    .panel-header h3 {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--neon-blue);
      text-transform: uppercase;
    }

    .panel-glow {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
      margin-bottom: 8px;
    }

    .card-preview-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
    }

    .card-details {
      padding: 1rem 1.5rem 1.5rem;
    }

    .plane-title {
      font-size: 1.4rem;
      font-weight: 800;
      font-family: 'Orbitron', monospace;
      background: linear-gradient(135deg, #fff, #88ddff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
      border-left: 4px solid var(--neon-blue);
      padding-left: 12px;
    }

    /* WIDGETS */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px 0 14px;
    }

    .tech-widget {
      background: rgba(0, 20, 40, 0.6);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      border: 1px solid rgba(0, 212, 255, 0.25);
      transition: all 0.2s;
    }

    .tech-widget:hover {
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
    }

    .widget-icon { font-size: 1.3rem; margin-bottom: 4px; }
    .widget-label { font-size: 0.55rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #8db4d4; }
    .widget-value { font-size: 1rem; font-weight: 700; color: #c4edff; }

    .spec-grid-tech {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0.8rem 0;
    }

    .spec-item-tech {
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 10px;
      border-radius: 12px;
      border-left: 2px solid var(--neon-blue);
    }

    .spec-label-tech { font-size: 0.55rem; text-transform: uppercase; font-weight: 600; color: #7e9ec2; }
    .spec-value-tech { font-size: 0.8rem; font-weight: 600; color: #eef5ff; }

    .btn-confirm-neon {
      width: 100%;
      background: linear-gradient(90deg, #0a2a3e, #051a2a);
      border: 1px solid var(--neon-blue);
      padding: 10px 0;
      border-radius: 40px;
      font-weight: 700;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1.5px;
      color: #ccf4ff;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 12px;
    }

    .btn-confirm-neon:hover {
      background: linear-gradient(90deg, #0f3b55, #062436);
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.6);
      transform: scale(0.98);
    }

    /* ===== FLOATING BOTTOM CAROUSEL ===== */
    .floating-carousel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(8, 14, 24, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 16px 20px;
      z-index: 15;
      transition: all 0.3s ease;
    }

    .carousel-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .carousel-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: var(--neon-blue);
      text-transform: uppercase;
    }

    .models-grid-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      overflow-x: auto;
      padding: 8px 12px;
      scroll-behavior: smooth;
    }

    .models-grid-center::-webkit-scrollbar { height: 4px; }
    .models-grid-center::-webkit-scrollbar-track { background: #0f1a2c; border-radius: 10px; }
    .models-grid-center::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

    /* MODEL CARDS */
    .model-card-center {
      flex: 0 0 180px;
      background: linear-gradient(145deg, rgba(0, 30, 50, 0.8), rgba(0, 15, 30, 0.9));
      border-radius: 24px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(0, 212, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      backdrop-filter: blur(4px);
    }

    .model-card-center:hover {
      transform: translateY(-6px);
      border-color: var(--neon-blue);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .model-card-center.active-card {
      border: 2px solid var(--neon-blue);
      background: linear-gradient(145deg, rgba(0, 60, 90, 0.9), rgba(0, 30, 50, 0.95));
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
      transform: translateY(-4px);
    }

    .model-icon-img {
      width: 100%;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 6px rgba(0,212,255,0.4));
      transition: transform 0.2s;
    }

    .model-card-center:hover .model-icon-img {
      transform: scale(1.03);
    }

    .model-name {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      color: #c4edff;
      margin-top: 6px;
    }

    .model-badge {
      font-size: 0.6rem;
      color: #7e9ec2;
      margin-top: 4px;
    }

    /* ANIMATIONS */
    @keyframes slideIntoView {
      0% { opacity: 0; transform: translateY(20px); filter: blur(2px);}
      100% { opacity: 1; transform: translateY(0); filter: blur(0);}
    }

    .slide-in {
      animation: slideIntoView 0.4s ease forwards;
    }

    .panel-slide-tech {
      animation: panelGlide 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    @keyframes panelGlide {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .floating-panel { width: 320px; top: 80px; max-height: calc(100vh - 300px); }
      .model-card-center { flex: 0 0 150px; }
      .model-icon-img { height: 75px; }
      .brand h1 { font-size: 1rem; }
    }

    @media (max-width: 700px) {
      .floating-panel { width: 280px; right: 12px; top: 70px; }
      .model-card-center { flex: 0 0 130px; padding: 10px 8px; }
      .model-name { font-size: 0.7rem; }
      .floating-carousel { padding: 12px 16px; }
      .brand h1 { font-size: 0.9rem; }
      .brand-icon { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Top Bar - Overlay on 3D view -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon">⚡🛸</div>
      <h1>AEROSPACE FRONTIER: NEURAL HANGAR</h1>
      <span class="version-tag">| full-immersion 3D</span>
    </div>
  </div>

  <!-- Full Screen 3D Viewer -->
  <div class="fullscreen-viewport">
    <model-viewer 
      id="aircraft-viewer" 
      src="" 
      alt="3D aircraft" 
      auto-rotate 
      rotation-speed="0.8"
      camera-controls 
      touch-action="pan-y" 
      exposure="1.3" 
      shadow-intensity="0.9" 
      camera-orbit="35deg 75deg 5m"
      style="width:100%; height:100%; background: radial-gradient(circle at center, #0a1525, #020408);">
    </model-viewer>
    <div class="model-status" id="modelStatus">⏳ INITIALIZING HOLOGRAPHIC DISPLAY</div>
  </div>

  <!-- Right Panel - Floating over the 3D view -->
  <div class="floating-panel" id="selectedPlaneCard">
    <div class="panel-header">
      <div class="panel-glow"></div>
      <h3>CURRENT VESSEL</h3>
    </div>
    <img class="card-preview-img" id="cardPreviewImg" alt="aircraft preview">
    <div class="card-details">
      <div class="plane-title" id="planeNameDisplay">Artemis Class Biplane</div>
      <div class="metrics-grid">
        <div class="tech-widget"><div class="widget-icon">⛽</div><div class="widget-label">FUEL</div><div class="widget-value" id="fuelValue">--</div></div>
        <div class="tech-widget"><div class="widget-icon">📡</div><div class="widget-label">RANGE</div><div class="widget-value" id="distanceValue">--</div></div>
        <div class="tech-widget"><div class="widget-icon">⚙️</div><div class="widget-label">T/W RATIO</div><div class="widget-value" id="twrValue">--</div></div>
        <div class="tech-widget"><div class="widget-icon">🌡️</div><div class="widget-label">CEILING</div><div class="widget-value" id="ceilingValue">--</div></div>
      </div>
      <div class="spec-grid-tech" id="specGridContainer"></div>
      <button class="btn-confirm-neon" id="confirmSelectionBtn">🔷 DEPLOY MISSION BRIEF 🔷</button>
    </div>
  </div>

  <!-- Bottom Carousel - Floating over 3D view -->
  <div class="floating-carousel">
    <div class="carousel-header">
      <span class="carousel-label">✦ SELECT AIRCRAFT - CLICK TO SLIDE INTO FRAME ✦</span>
    </div>
    <div class="models-grid-center" id="modelsGridCenter"></div>
  </div>
</div>

<script>
  // ========== FLEET DATA: 4 MODELS WITH YOUR EXACT FILE NAMES ==========
  const fleetData = [
    {
      id: "artemis_biplane",
      name: "Artemis Class Biplane",
      shortName: "Artemis Biplane",
      manufacturer: "Artemis Aeronautics",
      type: "Vintage Biplane",
      role: "Reconnaissance / Acrobatic",
      speed: "145 mph",
      passengerCapacity: "2",
      cost: "$ 127K",
      modelFile: "artemis class biplane.glb",
      iconFile: "artemis class biplane-plane.png",
      fuelRequired: "42 gal",
      flightDistance: "390 nmi",
      twr: "0.09:1",
      ceiling: "14.5k ft"
    },
    {
      id: "artemis_interceptor",
      name: "Artemis G-6 Interceptor",
      shortName: "G-6 Interceptor",
      manufacturer: "Artemis Defense",
      type: "Interceptor",
      role: "Air Superiority",
      speed: "Mach 1.9",
      passengerCapacity: "1",
      cost: "$ 42.5M",
      modelFile: "artemis g-6 interceptor.glb",
      iconFile: "artemis g-6 interceptor-plane.png",
      fuelRequired: "185 gal",
      flightDistance: "1250 nmi",
      twr: "0.94:1",
      ceiling: "54k ft"
    },
    {
      id: "f22_raptor",
      name: "F-22 Raptor",
      shortName: "F-22 Raptor",
      manufacturer: "Lockheed Martin",
      type: "Stealth Air Dominance",
      role: "5th Gen Fighter",
      speed: "Mach 2.25",
      passengerCapacity: "1",
      cost: "$ 150M",
      modelFile: "f-22 raptor.glb",
      iconFile: "f-22 raptor-plane.png",
      fuelRequired: "280 gal",
      flightDistance: "1839 nmi",
      twr: "1.09:1",
      ceiling: "65k ft"
    },
    {
      id: "nomad_skycar",
      name: "Nomad Skycar",
      shortName: "Nomad Skycar",
      manufacturer: "Nomad Aviation",
      type: "Personal eVTOL",
      role: "Urban Air Mobility",
      speed: "180 mph",
      passengerCapacity: "4",
      cost: "$ 289K",
      modelFile: "nomad skycar.glb",
      iconFile: "nomad skycar-plane.png",
      fuelRequired: "28 gal",
      flightDistance: "250 nmi",
      twr: "0.21:1",
      ceiling: "12k ft"
    }
  ];

  const MODEL_BASE_PATH = "./";
  const ICON_BASE_PATH = "./";

  function getModelPath(modelFile) { return MODEL_BASE_PATH + modelFile; }
  function getIconPath(iconFile) { return ICON_BASE_PATH + iconFile; }

  // DOM elements
  let currentSelectedPlaneId = fleetData[0].id;
  let isTransitioning = false;
  let slideDirection = "right"; // Track slide direction for variety

  const modelViewer = document.getElementById('aircraft-viewer');
  const cardPreviewImg = document.getElementById('cardPreviewImg');
  const planeNameDisplay = document.getElementById('planeNameDisplay');
  const specGridContainer = document.getElementById('specGridContainer');
  const modelsGrid = document.getElementById('modelsGridCenter');
  const confirmBtn = document.getElementById('confirmSelectionBtn');
  const modelStatusSpan = document.getElementById('modelStatus');
  const fuelValueSpan = document.getElementById('fuelValue');
  const distanceValueSpan = document.getElementById('distanceValue');
  const twrValueSpan = document.getElementById('twrValue');
  const ceilingValueSpan = document.getElementById('ceilingValue');
  const rightPanel = document.getElementById('selectedPlaneCard');

  // Handle image loading errors
  function handleImageError(imgElement, fallbackName) {
    if (!imgElement.getAttribute('data-fallback-set')) {
      imgElement.setAttribute('data-fallback-set', 'true');
      imgElement.src = `https://placehold.co/400x300/1a2a3a/00d4ff?text=${encodeURIComponent(fallbackName || 'Aircraft')}`;
    }
  }

  // Animation: 3D model slide effect - alternating directions for dramatic effect
  function animateModelSlide() {
    modelViewer.classList.remove('model-transition', 'model-slide-left');
    void modelViewer.offsetWidth;
    
    // Alternate slide direction based on which side the card was clicked (for variety)
    if (slideDirection === "left") {
      modelViewer.classList.add('model-slide-left');
    } else {
      modelViewer.classList.add('model-transition');
    }
    
    setTimeout(() => {
      modelViewer.classList.remove('model-transition', 'model-slide-left');
    }, 600);
  }

  // Animation: Right panel slide effect
  function animateRightPanel() {
    rightPanel.classList.remove('panel-slide-tech');
    void rightPanel.offsetWidth;
    rightPanel.classList.add('panel-slide-tech');
    setTimeout(() => rightPanel.classList.remove('panel-slide-tech'), 400);
  }

  // Render right panel with plane data
  function renderRightPanel(plane) {
    planeNameDisplay.textContent = plane.name;
    const iconPath = getIconPath(plane.iconFile);
    cardPreviewImg.src = iconPath;
    cardPreviewImg.onerror = () => handleImageError(cardPreviewImg, plane.name);
    
    fuelValueSpan.innerHTML = plane.fuelRequired;
    distanceValueSpan.innerHTML = plane.flightDistance;
    twrValueSpan.innerHTML = plane.twr;
    ceilingValueSpan.innerHTML = plane.ceiling;
    
    const specs = [
      { label: "MANUFACTURER", value: plane.manufacturer },
      { label: "TYPE", value: plane.type },
      { label: "ROLE", value: plane.role },
      { label: "MAX SPEED", value: plane.speed },
      { label: "PASSENGERS", value: plane.passengerCapacity },
      { label: "COST", value: plane.cost }
    ];
    
    specGridContainer.innerHTML = specs.map(spec => `
      <div class="spec-item-tech">
        <div class="spec-label-tech">${spec.label}</div>
        <div class="spec-value-tech">${spec.value}</div>
      </div>
    `).join('');
  }

  // Update 3D model with smooth sliding transition when clicking
  function updateModelForPlane(plane, direction = "right") {
    const modelPath = getModelPath(plane.modelFile);
    
    // Set slide direction for animation
    slideDirection = direction;
    
    if (modelViewer.src === modelPath && modelViewer.loaded) {
      // Even if same model, trigger slide animation for visual feedback
      animateModelSlide();
      return;
    }
    
    modelStatusSpan.textContent = `🌀 UPLINK: ${plane.name} - SLIDING INTO FRAME`;
    modelViewer.style.opacity = "0.7";
    
    // Brief delay to show the slide transition effect
    setTimeout(() => {
      modelViewer.src = modelPath;
    }, 50);
    
    const onLoad = () => {
      modelViewer.style.opacity = "1";
      // Trigger the slide-in animation after model loads
      setTimeout(() => {
        animateModelSlide();
      }, 50);
      modelStatusSpan.textContent = `✅ ${plane.name} | HOLOGRAPHIC ACTIVE`;
      setTimeout(() => {
        if (modelStatusSpan) modelStatusSpan.style.opacity = "0.9";
      }, 2000);
      modelViewer.removeEventListener('load', onLoad);
    };
    
    const onError = () => {
      modelStatusSpan.textContent = `⚠️ MODEL OFFLINE: ${plane.modelFile}`;
      modelViewer.style.opacity = "1";
      modelViewer.removeEventListener('error', onError);
    };
    
    modelViewer.addEventListener('load', onLoad, { once: true });
    modelViewer.addEventListener('error', onError, { once: true });
  }

  // Set active plane with smooth slide transition
  function setActivePlane(planeId, clickDirection = "right") {
    if (isTransitioning) return;
    const plane = fleetData.find(p => p.id === planeId);
    if (!plane) return;
    
    isTransitioning = true;
    currentSelectedPlaneId = planeId;
    renderRightPanel(plane);
    updateModelForPlane(plane, clickDirection);
    updateActiveCard(planeId);
    animateRightPanel();
    
    const activeCard = document.querySelector(`.model-card-center[data-plane-id="${planeId}"]`);
    if (activeCard) {
      activeCard.classList.add('slide-in');
      setTimeout(() => activeCard.classList.remove('slide-in'), 450);
      activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
    setTimeout(() => { isTransitioning = false; }, 650);
  }

  // Update active card highlight
  function updateActiveCard(activeId) {
    document.querySelectorAll('.model-card-center').forEach(card => {
      if (card.getAttribute('data-plane-id') === activeId) {
        card.classList.add('active-card');
      } else {
        card.classList.remove('active-card');
      }
    });
  }

  // Build the 4 centered model cards
  function buildModelsGrid() {
    modelsGrid.innerHTML = '';
    fleetData.forEach((plane, idx) => {
      const card = document.createElement('div');
      card.className = 'model-card-center';
      if (plane.id === currentSelectedPlaneId) card.classList.add('active-card');
      card.setAttribute('data-plane-id', plane.id);
      
      const img = document.createElement('img');
      img.className = 'model-icon-img';
      img.src = getIconPath(plane.iconFile);
      img.alt = plane.name;
      img.loading = 'eager';
      img.onerror = () => handleImageError(img, plane.name);
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'model-name';
      nameDiv.textContent = plane.shortName;
      
      const badge = document.createElement('div');
      badge.className = 'model-badge';
      badge.textContent = plane.type;
      
      card.appendChild(img);
      card.appendChild(nameDiv);
      card.appendChild(badge);
      
      // Determine slide direction based on card position relative to current
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        // Determine slide direction for dramatic effect
        const currentIndex = fleetData.findIndex(p => p.id === currentSelectedPlaneId);
        const newIndex = fleetData.findIndex(p => p.id === plane.id);
        const direction = newIndex > currentIndex ? "right" : "left";
        setActivePlane(plane.id, direction);
      });
      
      modelsGrid.appendChild(card);
      
      setTimeout(() => {
        card.classList.add('slide-in');
        setTimeout(() => card.classList.remove('slide-in'), 500);
      }, idx * 80);
    });
  }

  // Drag-to-scroll for carousel
  function initDragScroll() {
    if (!modelsGrid) return;
    let isDown = false;
    let startX;
    let scrollLeft;
    
    modelsGrid.addEventListener('mousedown', (e) => {
      isDown = true;
      modelsGrid.style.cursor = 'grabbing';
      startX = e.pageX - modelsGrid.offsetLeft;
      scrollLeft = modelsGrid.scrollLeft;
    });
    modelsGrid.addEventListener('mouseleave', () => {
      isDown = false;
      modelsGrid.style.cursor = 'grab';
    });
    modelsGrid.addEventListener('mouseup', () => {
      isDown = false;
      modelsGrid.style.cursor = 'grab';
    });
    modelsGrid.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - modelsGrid.offsetLeft;
      const walk = (x - startX) * 1.2;
      modelsGrid.scrollLeft = scrollLeft - walk;
    });
    modelsGrid.style.cursor = 'grab';
  }

  // Confirm selection handler
  confirmBtn.addEventListener('click', () => {
    const plane = fleetData.find(p => p.id === currentSelectedPlaneId);
    if (plane) {
      alert(`🚀 NEXUS COMMAND\n\n✈️ ${plane.name}\n⛽ FUEL: ${plane.fuelRequired}\n📡 RANGE: ${plane.flightDistance}\n⚡ T/W: ${plane.twr}\n🌡️ CEILING: ${plane.ceiling}\n\nMISSION DEPLOYED.`);
    }
  });

  // Initialize
  function init() {
    buildModelsGrid();
    initDragScroll();
    
    if (fleetData.length > 0) {
      const defaultPlane = fleetData[0];
      currentSelectedPlaneId = defaultPlane.id;
      renderRightPanel(defaultPlane);
      
      // Initial model load with slight delay for dramatic effect
      setTimeout(() => {
        updateModelForPlane(defaultPlane, "right");
      }, 100);
      
      updateActiveCard(defaultPlane.id);
      setTimeout(() => {
        const firstCard = document.querySelector(`.model-card-center[data-plane-id="${defaultPlane.id}"]`);
        if (firstCard) firstCard.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        animateRightPanel();
      }, 200);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
